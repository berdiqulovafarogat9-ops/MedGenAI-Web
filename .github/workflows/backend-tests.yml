name: Backend regression tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medgen_test
          POSTGRES_PASSWORD: ci-test-only-db-password
          POSTGRES_DB: medgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medgen_test -d medgen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx
      - name: Run backend tests
        env:
          MEDGEN_ADMIN_PASSWORD: ci-test-only-password
          MEDGEN_SECRET_KEY: ci-test-only-secret-key
          MEDGEN_TEST_DATABASE_URL: postgresql://medgen_test:ci-test-only-db-password@127.0.0.1:5432/medgen_test
        run: pytest -q backend/tests
