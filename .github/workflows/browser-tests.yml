name: Browser login tests
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install preview and browser dependencies
        run: |
          pip install fastapi uvicorn httpx rdkit 'pwdlib[argon2]'
          npm install --prefix /tmp/medgen-browser playwright@1.58.2 three@0.128.0 --no-audit --no-fund
          curl -fLsS --retry 2 --retry-delay 2 "https://dbkxgbeisgyjilflkneq.supabase.co/storage/v1/object/public/models/Casual%20Character%20by%20Quaternius%20-%20kZ3DmIoGip.glb" -o /tmp/medgen-browser/medgen-patient.glb
          test "$(head -c 4 /tmp/medgen-browser/medgen-patient.glb)" = "glTF"
          node /tmp/medgen-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test desktop and mobile login
        env:
          NODE_PATH: /tmp/medgen-browser/node_modules
        run: |
          python scripts/local_preview.py > /tmp/medgen-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/live; then break; fi
            sleep 1
          done
          node tests/browser-login.cjs
          node tests/browser-academy.cjs
          node tests/browser-clinical-simulator.cjs
          MEDGEN_TEST_PATIENT_GLB=/tmp/medgen-browser/medgen-patient.glb node tests/browser-clinical-simulator.cjs
          node tests/browser-workspaces.cjs
          node tests/browser-ux.cjs
          node tests/browser-opportunities.cjs
      - name: Preview diagnostics
        if: failure()
        run: cat /tmp/medgen-preview.log
