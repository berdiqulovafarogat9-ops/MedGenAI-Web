name: MedGen AI Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # CI-only values satisfy Compose interpolation; they are never deployed.
    env:
      MEDGEN_ADMIN_PASSWORD: ci-only-not-a-production-password
      MEDGEN_SECRET_KEY: ci-only-not-a-production-secret
      POSTGRES_PASSWORD: ci-only-not-a-production-db-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend JavaScript syntax
        run: node --check app.js

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build MedGen AI
        run: docker compose build
