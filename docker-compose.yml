services:
  medgen-api:
    build: ./backend
    restart: unless-stopped
    environment:
      MEDGEN_ADMIN_USERNAME: admin
      MEDGEN_ADMIN_PASSWORD: ${MEDGEN_ADMIN_PASSWORD:?Set MEDGEN_ADMIN_PASSWORD}
      MEDGEN_SECRET_KEY: ${MEDGEN_SECRET_KEY:?Set MEDGEN_SECRET_KEY}
    expose:
      - "8000"

  medgen-web:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - medgen-api
    restart: unless-stopped
